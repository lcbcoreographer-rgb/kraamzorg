# =============================================================================
# supabase/config.toml · Kraamzorg OS
#
# Configuração do Supabase LOCAL (supabase start, db reset, test db), PRD 5.1,
# 5.2 e 5.5. Não carrega segredo nenhum: nada de chave, senha, token ou URL de
# projeto remoto aqui. Os projetos kraamzorg-hml e kraamzorg-prod NÃO leem este
# arquivo para autenticação: o que vale lá é o painel do Supabase, e o passo a
# passo para deixar o painel igual a isto está em supabase/LIGAR.md.
#
# Sem Docker nesta máquina, supabase/sem-docker/scripts/resetar.sh lê a lista
# de seeds de [db.seed] deste arquivo, para os dois caminhos carregarem os
# mesmos dados sintéticos.
# =============================================================================

project_id = "kraamzorg-os"

[api]
enabled = true
port = 54321
# PRD 5.2: o PostgREST expõe só public e api. privado, assistencial, agente e
# agente_n8n nunca são expostos.
schemas = ["public", "api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Conferir com a versão do projeto remoto antes do "supabase link" (a CLI
# avisa quando diverge). O sem-docker usa Postgres 16.
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
# Só dado sintético (PRD 16.3, CLAUDE.md). Ordem importa: seed.sql cria os
# parâmetros, textos, famílias e conversas; o segundo arquivo traz a base de
# conhecimento inicial do agente (P26), toda em rascunho, sem repetir nada do
# primeiro.
sql_paths = ["./seed.sql", "./dados/base_conhecimento_seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
# Access token de 1 hora (padrão do Supabase). É o tempo máximo que um
# aparelho ainda usa o token depois de api.revogar_sessoes.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Ninguém se cadastra sozinho: a conta nasce do convite da diretoria (P07,
# gatilho privado.criar_perfil_do_convite da 0007).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

# PRD 5.1 e 21.2: sessão de 8 horas.
[auth.sessions]
timebox = "8h"

# PRD 5.1, 13 e 21.2: MFA TOTP. O AAL2 é exigido pelas políticas e pelas
# funções api (privado.aal2), não por esta configuração.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
